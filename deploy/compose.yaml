name: open-generative-ai

services:
  app:
    build:
      context: ./source
    image: falak-open-generative-ai:staff-keys
    restart: unless-stopped
    env_file:
      - ./secrets/storage.env
      - ./secrets/staff.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./secrets/muapi_api_key:/run/secrets/muapi_api_key:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=256m
      - /app/.next/cache:uid=1000,gid=1000,mode=0750,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 4
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: unless-stopped
    user: 65532:65532
    command:
    - tunnel
    - --no-autoupdate
    - --metrics
    - 0.0.0.0:2000
    - run
    - --token-file
    - /run/secrets/cloudflared_token
    volumes:
    - ./secrets/cloudflared_token:/run/secrets/cloudflared_token:ro
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
