name: open-generative-ai

services:
  app:
    build:
      context: ./source
    image: falak-open-generative-ai:staff-keys
    restart: unless-stopped
    env_file:
      - ./secrets/storage.env
      - ./secrets/staff.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./secrets/muapi_api_key:/run/secrets/muapi_api_key:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=256m
      - /app/.next/cache:uid=1000,gid=1000,mode=0750,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 4
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
